name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request replaces a run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential clang zlib1g-dev pkg-config libasound2-dev

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The bridge's Native AOT build downloads a large compiler package for
      # each platform. The cache changes only when a project's packages do.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('core/**/*.csproj') }}

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      # Caches Cargo's downloads and the compiled dependencies. Only main saves
      # it, so pull requests reuse main's cache instead of each adding one.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy without the bridge
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Bridge tests
        run: dotnet test core/uelib-bridge-tests
