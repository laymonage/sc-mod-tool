[workspace]
members = ["core"]
default-members = [".", "core"]

[package]
name = "sc-mod-tool"
version = "0.1.0"
edition = "2024"

[features]
default = ["uelib-bridge"]
uelib-bridge = ["sc-mod-tool-core/uelib-bridge"]

[dependencies]
eframe = { version = "0.36.2", features = ["persistence", "wgpu"] }
egui_extras = { version = "0.36.2", default-features = false }
rfd = "0.17.2"
rodio = "0.20.1"
sc-mod-tool-core = { path = "core", default-features = false }
