[package]
name = "sc-mod-tool-core"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[features]
default = ["uelib-bridge"]
# Builds the .NET Native AOT UELib bridge used for subtitle matching, requires .NET 10 SDK.
uelib-bridge = []

[dependencies]
encoding_rs = "0.8"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = { version = "1.2", features = ["parallel"] }

[dev-dependencies]
tempfile = "3"
