[workspace]
members = ["core"]
default-members = [".", "core"]

[package]
name = "sc-mod-tool"
version = "0.1.0"
edition = "2024"

[features]
default = ["uelib-bridge"]
uelib-bridge = ["sc-mod-tool-core/uelib-bridge"]

[dependencies]
eframe = { version = "0.37.0", features = ["persistence", "wgpu"] }
egui_extras = { version = "0.37.0", default-features = false }
egui_material_icons = "0.9.0"
rfd = "0.17.2"
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
sc-mod-tool-core = { path = "core", default-features = false }

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["eframe", "wgpu", "snapshot"] }
